# GoReleaser configuration for a Terraform provider, following
# hashicorp/terraform-provider-scaffolding-framework. The Terraform Registry
# expects exactly these artifact names:
#   terraform-provider-uptimewarden_<version>_<os>_<arch>.zip
#   terraform-provider-uptimewarden_<version>_SHA256SUMS (+ .sig, GPG)
#   terraform-provider-uptimewarden_<version>_manifest.json
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      # Statically linked binaries; the provider must run on any host.
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{ .Version }}'
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - '386'
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: '386'
      # Go marks windows/arm (32-bit) as a broken port.
      - goos: windows
        goarch: arm
    binary: '{{ .ProjectName }}_v{{ .Version }}'

archives:
  - formats: ['zip']
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      # GPG_FINGERPRINT is set by the release workflow from the imported key.
      - '--batch'
      - '--local-user'
      - '{{ .Env.GPG_FINGERPRINT }}'
      - '--output'
      - '${signature}'
      - '--detach-sign'
      - '${artifact}'

release:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'

changelog:
  disable: true
